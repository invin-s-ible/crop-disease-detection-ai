{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-6">
    <h2 class="section-title mb-4"><i class="fa-solid fa-id-card me-2"></i>My Profile</h2>
    <div class="card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="fa-solid fa-circle-user fa-4x text-success"></i>
          <h4 class="mt-2 mb-0">{{ user.full_name }}</h4>
          <p class="text-muted mb-0">@{{ user.username }}</p>
        </div>
        <table class="table table-borderless">
          <tr><th class="text-muted small">Email</th><td>{{ user.email }}</td></tr>
          <tr><th class="text-muted small">Phone</th><td>{{ user.phone }}</td></tr>
          <tr><th class="text-muted small">Location</th><td>{{ user.location }}</td></tr>
          <tr><th class="text-muted small">Member Since</th><td>{{ user.created_at.strftime('%d %b %Y') }}</td></tr>
        </table>
      </div>
    </div>
  </div>
</div>

{% endblock %}
