{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="fa-solid fa-seedling fa-4x text-success mb-3"></i>
  <h1 class="fw-bold">404</h1>
  <p class="text-muted mb-4">This page seems to have wilted away.</p>
  <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}" class="btn btn-ag text-white">Back to Safety</a>
</div>
{% endblock %}
