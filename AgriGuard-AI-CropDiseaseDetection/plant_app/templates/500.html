{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="fa-solid fa-triangle-exclamation fa-4x text-warning mb-3"></i>
  <h1 class="fw-bold">500</h1>
  <p class="text-muted mb-4">Something went wrong on our end. Please try again.</p>
  <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}" class="btn btn-ag text-white">Back to Safety</a>
</div>
{% endblock %}
